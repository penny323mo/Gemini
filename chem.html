<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中英文互動元素週期表 (Interactive Periodic Table)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Grid for 18 columns */
        .grid-cols-18 {
            grid-template-columns: repeat(18, minmax(0, 1fr));
        }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Utility for centering text in element box */
        .element-box {
            aspect-ratio: 4/5;
        }
        @media (min-width: 640px) {
            .element-box {
                aspect-ratio: auto;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 p-2 sm:p-6 font-sans text-slate-900">

    <!-- App Container -->
    <div id="app" class="max-w-[1600px] mx-auto">

                <p class="text-sm text-slate-500">互動式學習工具 | Interactive Learning Tool</p>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                <!-- Search -->
                <div class="relative w-full sm:w-auto">

                    <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-2.5 top-2.5 h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input 
                        type="text" 
                        id="searchInput"
                        placeholder="搜尋元素 (Search)..." 
                        class="pl-9 pr-4 py-2 w-full sm:w-64 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                    >
                </div>

                <!-- Language Toggle -->

                    <button data-lang="en" class="lang-btn px-3 py-1.5 text-xs font-medium rounded-md transition-all text-slate-500 hover:text-slate-700">English</button>

            </div>
        </header>

        <!-- Main Layout -->

                    <div class="col-start-3 row-start-6 flex items-center justify-center text-xs text-slate-400 font-medium border border-dashed border-slate-300 rounded-md select-none">57-71</div>

                    <div class="col-start-1 row-start-2 text-xs text-slate-300 absolute -left-4 top-[95px]">2</div>

            </div>

                            </svg>
                        </div>
                        <p class="text-sm">點擊任何元素查看詳細資料</p>
                        <p class="text-xs mt-1">Select an element to view details</p>
                    </div>

                    <!-- Content State (Hidden by default) -->
                    <div id="detailContent" class="hidden h-full flex flex-col">
                        <!-- Header Section with Dynamic Color -->
                        <div id="detailHeader" class="p-6 transition-colors duration-300">
                            <div class="flex justify-between items-start">
                                <span id="detailNumber" class="text-2xl font-mono opacity-60"></span>
                                <button id="closeDetailBtn" class="p-1 hover:bg-black/10 rounded-full transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 opacity-60" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                                    </svg>
                                </button>
                            </div>
                            <div class="text-center my-4">
                                <h2 id="detailSymbol" class="text-6xl font-bold"></h2>
                                <div class="flex items-center justify-center gap-2 mt-2">
                                    <h3 id="detailNameZh" class="text-xl font-medium"></h3>
                                    <span class="opacity-60">|</span>
                                    <h3 id="detailNameEn" class="text-xl"></h3>
                                </div>
                                <div id="detailWeight" class="mt-1 text-sm font-mono opacity-80"></div>
                            </div>
                        </div>

                                <span id="detailCategoryDot" class="w-3 h-3 rounded-full bg-gray-400"></span>

                                <p id="detailSummary" class="text-slate-700 text-sm leading-relaxed"></p>
                            </div>

                                    <div class="text-xs text-slate-400">Group (族)</div>
                                    <div id="detailGroup" class="font-mono font-medium"></div>
                                </div>
                                <div class="bg-slate-50 p-2 rounded text-center">
                                    <div class="text-xs text-slate-400">Period (週期)</div>
                                    <div id="detailPeriod" class="font-mono font-medium"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                    <div id="legendGrid" class="grid grid-cols-2 gap-2">
                        <!-- Legend items injected by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

            { number: 110, symbol: "Ds", name_en: "Darmstadtium", name_zh: "鐽", weight: "(281)", category: "unknown", group: 10, period: 7, summary: "於德國達姆施塔特發現。" },
            { number: 111, symbol: "Rg", name_en: "Roentgenium", name_zh: "錀", weight: "(280)", category: "unknown", group: 11, period: 7, summary: "以X光發現者倫琴命名。" },

            { number: 113, symbol: "Nh", name_en: "Nihonium", name_zh: "鉨", weight: "(284)", category: "unknown", group: 13, period: 7, summary: "首個亞洲 (日本) 發現嘅元素。" },
            { number: 114, symbol: "Fl", name_en: "Flerovium", name_zh: "鈇", weight: "(289)", category: "post-transition metal", group: 14, period: 7, summary: "人工合成極重元素。" },
            { number: 115, symbol: "Mc", name_en: "Moscovium", name_zh: "鏌", weight: "(288)", category: "unknown", group: 15, period: 7, summary: "以莫斯科命名。" },
            { number: 116, symbol: "Lv", name_en: "Livermorium", name_zh: "鉝", weight: "(293)", category: "unknown", group: 16, period: 7, summary: "以勞倫斯利佛摩國家實驗室命名。" },
            { number: 117, symbol: "Ts", name_en: "Tennessine", name_zh: "鿬", weight: "(294)", category: "unknown", group: 17, period: 7, summary: "鹵素家族中最重成員。" },
            { number: 118, symbol: "Og", name_en: "Oganesson", name_zh: "鿫", weight: "(294)", category: "noble gas", group: 18, period: 7, summary: "目前已知最重元素，以 Oganessian 命名。" }
        ];

        const categories = {
            "diatomic nonmetal": { label_en: "Diatomic Nonmetal", label_zh: "雙原子非金屬", color: "bg-green-200 border-green-400 text-green-900" },
            "noble gas": { label_en: "Noble Gas", label_zh: "稀有氣體", color: "bg-purple-200 border-purple-400 text-purple-900" },
            "alkali metal": { label_en: "Alkali Metal", label_zh: "鹼金屬", color: "bg-red-200 border-red-400 text-red-900" },
            "alkaline earth metal": { label_en: "Alkaline Earth", label_zh: "鹼土金屬", color: "bg-orange-200 border-orange-400 text-orange-900" },
            "metalloid": { label_en: "Metalloid", label_zh: "類金屬", color: "bg-teal-200 border-teal-400 text-teal-900" },
            "polyatomic nonmetal": { label_en: "Polyatomic Nonmetal", label_zh: "多原子非金屬", color: "bg-emerald-200 border-emerald-400 text-emerald-900" },
            "post-transition metal": { label_en: "Post-transition", label_zh: "貧金屬", color: "bg-gray-300 border-gray-500 text-gray-900" },
            "transition metal": { label_en: "Transition Metal", label_zh: "過渡金屬", color: "bg-yellow-200 border-yellow-400 text-yellow-900" },
            "lanthanide": { label_en: "Lanthanide", label_zh: "鑭系元素", color: "bg-pink-200 border-pink-400 text-pink-900" },
            "actinide": { label_en: "Actinide", label_zh: "錒系元素", color: "bg-pink-300 border-pink-500 text-pink-900" },
            "unknown": { label_en: "Unknown", label_zh: "性質未明", color: "bg-gray-200 border-gray-300 text-gray-700" }
        };

        // --- State Management ---
        let state = {
            lang: 'both', // 'zh', 'en', 'both'
            searchTerm: '',
            selectedElement: null
        };

        // --- DOM Elements ---
        const periodicGrid = document.getElementById('periodicGrid');
        const legendGrid = document.getElementById('legendGrid');
        const searchInput = document.getElementById('searchInput');
        const langButtons = document.querySelectorAll('.lang-btn');
        const detailEmpty = document.getElementById('detailEmpty');
        const detailContent = document.getElementById('detailContent');
        const closeDetailBtn = document.getElementById('closeDetailBtn');

        // --- Functions ---

        function init() {
            renderLegend();
            renderTable();
            setupEventListeners();
        }

        function setupEventListeners() {
            // Search
            searchInput.addEventListener('input', (e) => {
                state.searchTerm = e.target.value.toLowerCase();
                renderTable(); // Re-render to show dimming effect
            });

            // Language Toggle
            langButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const lang = btn.getAttribute('data-lang');
                    state.lang = lang;
                    
                    // Update buttons UI
                    langButtons.forEach(b => {
                        if (b.getAttribute('data-lang') === lang) {
                            b.className = "lang-btn px-3 py-1.5 text-xs font-medium rounded-md transition-all bg-white shadow text-blue-600";
                        } else {
                            b.className = "lang-btn px-3 py-1.5 text-xs font-medium rounded-md transition-all text-slate-500 hover:text-slate-700";
                        }
                    });

                    renderTable();
                    renderLegend();
                    if (state.selectedElement) {
                        updateDetailPanel(state.selectedElement);
                    }
                });
            });

            // Close Detail Panel
            closeDetailBtn.addEventListener('click', () => {
                state.selectedElement = null;
                updateDetailPanel(null);
                renderTable(); // To remove selection ring
            });
        }

        function getGridPosition(el) {
            if (el.category === 'lanthanide') {
                return { col: (el.number - 57) + 3, row: 9 };
            }
            if (el.category === 'actinide') {
                return { col: (el.number - 89) + 3, row: 10 };
            }
            return { col: el.group, row: el.period };
        }

        function isMatch(el) {
            if (!state.searchTerm) return true;
            const term = state.searchTerm;
            return (
                el.name_en.toLowerCase().includes(term) ||
                el.name_zh.includes(term) ||
                el.symbol.toLowerCase().includes(term) ||
                el.number.toString().includes(term)
            );
        }

        function renderTable() {
            // Clear existing element boxes (keep the static visual guides)
            const existingElements = periodicGrid.querySelectorAll('.element-item');
            existingElements.forEach(e => e.remove());

            elementsData.forEach(el => {
                const pos = getGridPosition(el);
                const style = categories[el.category];
                const dimmed = !isMatch(el);
                const selected = state.selectedElement && state.selectedElement.number === el.number;

                const elDiv = document.createElement('div');
                elDiv.className = `element-item element-box relative p-1 sm:p-1.5 rounded-md border cursor-pointer transition-all duration-200 flex flex-col justify-between select-none ${style.color}`;
                
                // Add conditional classes
                if (dimmed) {
                    elDiv.classList.add('opacity-20', 'grayscale');
                } else {
                    elDiv.classList.add('hover:scale-110', 'hover:z-10', 'hover:shadow-lg');
                }

                if (selected) {
                    elDiv.classList.add('ring-2', 'ring-blue-600', 'z-20', 'scale-105', 'shadow-md');
                }

                // Grid positioning
                elDiv.style.gridColumnStart = pos.col;
                elDiv.style.gridRowStart = pos.row;

                // Content
                const zhName = `<span class="text-[9px] sm:text-[10px] font-medium truncate w-full text-center block">${el.name_zh}</span>`;
                const enName = `<span class="text-[8px] sm:text-[9px] truncate w-full text-center opacity-80 block">${el.name_en}</span>`;
                
                let nameHtml = '';
                if (state.lang === 'zh') nameHtml = zhName;
                else if (state.lang === 'en') nameHtml = enName;
                else nameHtml = `${zhName}${enName}`;

                elDiv.innerHTML = `
                    <span class="text-[10px] leading-none opacity-70 font-mono">${el.number}</span>
                    <div class="flex flex-col items-center justify-center flex-1 w-full overflow-hidden">
                        <span class="font-bold text-sm sm:text-lg leading-tight">${el.symbol}</span>
                        <div class="flex flex-col items-center mt-0.5 w-full">
                            ${nameHtml}
                        </div>
                    </div>
                `;

                // Click Event
                elDiv.addEventListener('click', () => {
                    state.selectedElement = el;
                    updateDetailPanel(el);
                    renderTable(); // Re-render to update selection ring
                });

                periodicGrid.appendChild(elDiv);
            });
        }

        function renderLegend() {
            legendGrid.innerHTML = '';
            Object.entries(categories).forEach(([key, cat]) => {
                const item = document.createElement('div');
                item.className = 'flex items-center gap-2';
                const colorClass = cat.color.split(' ')[0]; // Extract bg class
                
                const label = state.lang === 'en' ? cat.label_en : cat.label_zh;

                item.innerHTML = `
                    <div class="w-3 h-3 rounded-full ${colorClass}"></div>
                    <span class="text-xs text-slate-600 truncate">${label}</span>
                `;
                legendGrid.appendChild(item);
            });
        }

        function updateDetailPanel(el) {
            if (!el) {
                detailEmpty.classList.remove('hidden');
                detailContent.classList.add('hidden');
                return;
            }

            detailEmpty.classList.add('hidden');
            detailContent.classList.remove('hidden');

            const cat = categories[el.category];
            const header = document.getElementById('detailHeader');
            
            // Update Header Color
            // Remove all possible bg colors first (simplest way is to reset className or remove known bg classes)
            // But here we rely on the specific classes in our data.
            // A safer way in vanilla JS without removing all classes is to set className completely
            header.className = `p-6 transition-colors duration-300 ${cat.color}`;

            // Update Text Content
            document.getElementById('detailNumber').textContent = `#${el.number}`;
            document.getElementById('detailSymbol').textContent = el.symbol;
            document.getElementById('detailNameZh').textContent = el.name_zh;
            document.getElementById('detailNameEn').textContent = el.name_en;
            document.getElementById('detailWeight').textContent = `${el.weight} u`;
            
            document.getElementById('detailCategoryDot').className = `w-3 h-3 rounded-full ${cat.color.split(' ')[0]}`;
            document.getElementById('detailCategoryText').textContent = state.lang === 'en' ? cat.label_en : cat.label_zh;
            
            document.getElementById('detailSummary').textContent = el.summary;
            document.getElementById('detailGroup').textContent = el.group;
            document.getElementById('detailPeriod').textContent = el.period;
        }

        // --- Init ---
        init();

    </script>
</body>
